<body>
  <main class="app" id="app">
    <section class="screen" id="screen-aujourdhui" data-screen="aujourdhui" aria-labelledby="t-aujourdhui"></section>
    <section class="screen" id="screen-sommeil" data-screen="sommeil" aria-labelledby="t-sommeil" hidden></section>
    <section class="screen" id="screen-sport" data-screen="sport" aria-labelledby="t-sport" hidden></section>
    <section class="screen" id="screen-coach" data-screen="coach" aria-labelledby="t-coach" hidden></section>
    <section class="screen" id="screen-profil" data-screen="profil" aria-labelledby="t-profil" hidden></section>

    <noscript>
      <div class="card"><h2>JavaScript est nécessaire</h2><p>PULSE calcule tout sur ton téléphone : active JavaScript pour l'utiliser.</p></div>
    </noscript>
  </main>

  <a class="fab" href="#/coach" id="fab-coach" aria-label="Parler au coach"></a>

  <nav class="tabbar" aria-label="Navigation principale">
    <ul>
      <li><a href="#/aujourdhui" data-tab="aujourdhui" data-icon="sun">Aujourd'hui</a></li>
      <li><a href="#/sommeil" data-tab="sommeil" data-icon="moon">Sommeil</a></li>
      <li><a href="#/sport" data-tab="sport" data-icon="dumbbell">Sport</a></li>
      <li><a href="#/coach" data-tab="coach" data-icon="sparkles">Coach</a></li>
      <li><a href="#/profil" data-tab="profil" data-icon="user-round">Profil</a></li>
    </ul>
  </nav>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="actions">
      <button class="btn" value="cancel" id="confirm-cancel">Annuler</button>
      <button class="btn danger" value="ok" id="confirm-ok">Confirmer</button>
    </div>
  </dialog>
</body>
